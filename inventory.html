<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management - Inventory Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="js/app.js"></script>
</head>
<body class="bg-gray-50">
    <div x-data="{ sidebarOpen: false, currentPage: 'inventory', ...inventoryManager() }">
        <!-- Sidebar -->
        <div id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-white shadow-lg transform transition-transform duration-300 ease-in-out -translate-x-full lg:translate-x-0">
            <div class="flex items-center justify-center h-16 bg-blue-600">
                <h1 class="text-white text-xl font-bold">Inventory System</h1>
            </div>
            <nav class="mt-5">
                <a href="index.html" data-nav-item="dashboard"
                   class="flex items-center px-6 py-2 text-gray-700 hover:bg-gray-100">
                    <i class="fas fa-tachometer-alt mr-3"></i>
                    Dashboard
                </a>
                <a href="products.html" data-nav-item="products"
                   class="flex items-center px-6 py-2 text-gray-700 hover:bg-gray-100">
                    <i class="fas fa-box mr-3"></i>
                    Products
                </a>
                <a href="inventory.html" data-nav-item="inventory"
                   class="flex items-center px-6 py-2 text-gray-700 hover:bg-gray-100 bg-gray-100">
                    <i class="fas fa-warehouse mr-3"></i>
                    Inventory
                </a>
                <a href="customers.html" data-nav-item="customers"
                   class="flex items-center px-6 py-2 text-gray-700 hover:bg-gray-100">
                    <i class="fas fa-users mr-3"></i>
                    Customers
                </a>
                <a href="invoices.html" data-nav-item="invoices"
                   class="flex items-center px-6 py-2 text-gray-700 hover:bg-gray-100">
                    <i class="fas fa-file-invoice mr-3"></i>
                    Invoices
                </a>
                <a href="pos.html" data-nav-item="pos"
                   class="flex items-center px-6 py-2 text-gray-700 hover:bg-gray-100">
                    <i class="fas fa-cash-register mr-3"></i>
                    POS
                </a>
                <a href="reports.html" data-nav-item="reports"
                   class="flex items-center px-6 py-2 text-gray-700 hover:bg-gray-100">
                    <i class="fas fa-chart-bar mr-3"></i>
                    Reports
                </a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="lg:ml-64">
            <!-- Header -->
            <header class="bg-white shadow-sm border-b border-gray-200">
                <div class="flex items-center justify-between px-6 py-4">
                    <div class="flex items-center">
                        <button id="sidebar-toggle" class="lg:hidden text-gray-500 hover:text-gray-700">
                            <i class="fas fa-bars text-xl"></i>
                        </button>
                        <h2 class="ml-4 text-xl font-semibold text-gray-800">Inventory Management</h2>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button @click="showAdjustModal = true" class="bg-yellow-600 text-white px-4 py-2 rounded-lg hover:bg-yellow-700 text-sm">
                            <i class="fas fa-edit mr-2"></i>Stock Adjustment
                        </button>
                        <button @click="showReceiveModal = true" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 text-sm">
                            <i class="fas fa-plus mr-2"></i>Receive Stock
                        </button>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <main class="p-6">
            <!-- Inventory Overview -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="p-3 rounded-full bg-blue-100">
                            <i class="fas fa-cubes text-blue-600"></i>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-600">Total Items</p>
                            <p class="text-2xl font-bold text-gray-900" x-text="inventory.totalItems"></p>
                        </div>
                    </div>
                </div>
                
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="p-3 rounded-full bg-green-100">
                            <i class="fas fa-chart-line text-green-600"></i>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-600">Total Value</p>
                            <p class="text-2xl font-bold text-gray-900" x-text="formatCurrency(inventory.totalValue)"></p>
                        </div>
                    </div>
                </div>
                
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="p-3 rounded-full bg-yellow-100">
                            <i class="fas fa-exclamation-triangle text-yellow-600"></i>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-600">Low Stock</p>
                            <p class="text-2xl font-bold text-gray-900" x-text="inventory.lowStockItems"></p>
                        </div>
                    </div>
                </div>
                
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="p-3 rounded-full bg-red-100">
                            <i class="fas fa-times-circle text-red-600"></i>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-600">Out of Stock</p>
                            <p class="text-2xl font-bold text-gray-900" x-text="inventory.outOfStockItems"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Search and Filter -->
            <div class="bg-white rounded-lg shadow mb-6 p-6">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Search Products</label>
                        <div class="relative">
                            <input type="text" x-model="searchTerm" placeholder="Search by name or SKU..." 
                                   class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Category</label>
                        <select x-model="selectedCategory" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="">All Categories</option>
                            <option value="Car Batteries">Car Batteries</option>
                            <option value="Motorcycle Batteries">Motorcycle Batteries</option>
                            <option value="Inverter Batteries">Inverter Batteries</option>
                            <option value="Solar Batteries">Solar Batteries</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Stock Status</label>
                        <select x-model="stockFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="">All Stock</option>
                            <option value="in-stock">In Stock</option>
                            <option value="low-stock">Low Stock</option>
                            <option value="out-of-stock">Out of Stock</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <button @click="clearFilters()" class="w-full px-4 py-2 text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                            <i class="fas fa-times mr-2"></i>Clear Filters
                        </button>
                    </div>
                </div>
            </div>

            <!-- Inventory Table -->
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h3 class="text-lg font-semibold text-gray-800">Current Stock Levels</h3>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Product</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">SKU</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Current Stock</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Min Level</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Stock Value</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Last Updated</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            <template x-for="item in filteredInventory" :key="item.id">
                                <tr class="hover:bg-gray-50">
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <div class="flex items-center">
                                            <img :src="item.image || 'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=48&h=48&fit=crop'" 
                                                 :alt="item.name" 
                                                 class="h-12 w-12 rounded-lg object-cover mr-4 border border-gray-200">
                                            <div>
                                                <div class="text-sm font-medium text-gray-900" x-text="item.name"></div>
                                                <div class="text-sm text-gray-500" x-text="item.category"></div>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" x-text="item.sku"></td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <div class="flex items-center">
                                            <span class="text-sm font-medium text-gray-900 mr-2" x-text="item.stock"></span>
                                            <span :class="getStockStatusClass(item.stock, item.minStock)" 
                                                  class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full">
                                                <i :class="getStockIcon(item.stock, item.minStock)" class="mr-1"></i>
                                                <span x-text="getStockStatus(item.stock, item.minStock)"></span>
                                            </span>
                                        </div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" x-text="item.minStock"></td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" x-text="formatCurrency(item.stock * item.costPrice)"></td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="formatDate(item.lastUpdated)"></td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                        <button @click="adjustStock(item)" class="text-indigo-600 hover:text-indigo-900 mr-3">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                        <button @click="viewHistory(item)" class="text-blue-600 hover:text-blue-900">
                                            <i class="fas fa-history"></i>
                                        </button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
            </main>
        </div>

        <!-- Mobile sidebar overlay -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-gray-600 bg-opacity-75 lg:hidden hidden"></div>
    </div>

    <!-- Stock Adjustment Modal -->
    <div x-show="showAdjustModal" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50"
         style="display: none;">
        
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-medium text-gray-900">Stock Adjustment</h3>
                    <button @click="showAdjustModal = false" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                
                <form @submit.prevent="processStockAdjustment()" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Product</label>
                        <select x-model="adjustmentForm.productId" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="">Select Product</option>
                            <template x-for="item in inventoryItems" :key="item.id">
                                <option :value="item.id" x-text="item.name + ' (' + item.stock + ' current)'"></option>
                            </template>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Adjustment Type</label>
                        <select x-model="adjustmentForm.type" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="increase">Increase Stock</option>
                            <option value="decrease">Decrease Stock</option>
                            <option value="set">Set Exact Amount</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Quantity</label>
                        <input type="number" x-model="adjustmentForm.quantity" required min="1" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Reason</label>
                        <textarea x-model="adjustmentForm.reason" rows="3" 
                                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" 
                                  placeholder="Reason for adjustment..."></textarea>
                    </div>

                    <div class="flex justify-end space-x-4 pt-4">
                        <button type="button" @click="showAdjustModal = false" 
                                class="px-4 py-2 text-gray-700 border border-gray-300 rounded-lg hover:bg-gray-50">
                            Cancel
                        </button>
                        <button type="submit" 
                                class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                            Apply Adjustment
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Receive Stock Modal -->
    <div x-show="showReceiveModal" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50"
         style="display: none;">
        
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-medium text-gray-900">Receive Stock</h3>
                    <button @click="showReceiveModal = false" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                
                <form @submit.prevent="processStockReceiving()" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Product</label>
                        <select x-model="receiveForm.productId" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="">Select Product</option>
                            <template x-for="item in inventoryItems" :key="item.id">
                                <option :value="item.id" x-text="item.name"></option>
                            </template>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Quantity Received</label>
                        <input type="number" x-model="receiveForm.quantity" required min="1" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Supplier</label>
                        <input type="text" x-model="receiveForm.supplier" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" 
                               placeholder="Supplier name">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Purchase Order #</label>
                        <input type="text" x-model="receiveForm.poNumber" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" 
                               placeholder="PO Number">
                    </div>

                    <div class="flex justify-end space-x-4 pt-4">
                        <button type="button" @click="showReceiveModal = false" 
                                class="px-4 py-2 text-gray-700 border border-gray-300 rounded-lg hover:bg-gray-50">
                            Cancel
                        </button>
                        <button type="submit" 
                                class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
                            Receive Stock
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function inventoryManager() {
            return {
                showAdjustModal: false,
                showReceiveModal: false,
                searchTerm: '',
                selectedCategory: '',
                stockFilter: '',
                adjustmentForm: {
                    productId: '',
                    type: 'increase',
                    quantity: 1,
                    reason: ''
                },
                receiveForm: {
                    productId: '',
                    quantity: 1,
                    supplier: '',
                    poNumber: ''
                },
                inventory: {
                    totalItems: 463,
                    totalValue: 8750000,
                    lowStockItems: 7,
                    outOfStockItems: 3
                },
                inventoryItems: [
                    {
                        id: 1,
                        name: 'VISCA 100AH BATTERY',
                        sku: 'VISCA-100AH',
                        category: 'Car Batteries',
                        stock: 25,
                        minStock: 5,
                        costPrice: 65000,
                        lastUpdated: '2025-07-15',
                        image: 'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=300&h=200&fit=crop'
                    },
                    {
                        id: 2,
                        name: 'SOLITE 75AH BATTERY',
                        sku: 'SOLITE-75AH',
                        category: 'Car Batteries',
                        stock: 3,
                        minStock: 5,
                        costPrice: 45000,
                        lastUpdated: '2025-07-14',
                        image: 'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=300&h=200&fit=crop'
                    },
                    {
                        id: 3,
                        name: 'RUN-ALL 90AH BATTERY',
                        sku: 'RUNALL-90AH',
                        category: 'Car Batteries',
                        stock: 15,
                        minStock: 5,
                        costPrice: 55000,
                        lastUpdated: '2025-07-13',
                        image: 'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=300&h=200&fit=crop'
                    },
                    {
                        id: 4,
                        name: 'TIGER HEAD 12AH BATTERY',
                        sku: 'TIGER-12AH',
                        category: 'Motorcycle Batteries',
                        stock: 30,
                        minStock: 10,
                        costPrice: 12000,
                        lastUpdated: '2025-07-12',
                        image: 'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=300&h=200&fit=crop'
                    },
                    {
                        id: 5,
                        name: 'ROCKET 200AH INVERTER BATTERY',
                        sku: 'ROCKET-200AH',
                        category: 'Inverter Batteries',
                        stock: 0,
                        minStock: 3,
                        costPrice: 95000,
                        lastUpdated: '2025-07-10',
                        image: 'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=300&h=200&fit=crop'
                    }
                ],

                get filteredInventory() {
                    return this.inventoryItems.filter(item => {
                        const matchesSearch = !this.searchTerm || 
                            item.name.toLowerCase().includes(this.searchTerm.toLowerCase()) ||
                            item.sku.toLowerCase().includes(this.searchTerm.toLowerCase());
                        
                        const matchesCategory = !this.selectedCategory || 
                            item.category === this.selectedCategory;
                        
                        const matchesStock = !this.stockFilter || 
                            (this.stockFilter === 'in-stock' && item.stock > item.minStock) ||
                            (this.stockFilter === 'low-stock' && item.stock <= item.minStock && item.stock > 0) ||
                            (this.stockFilter === 'out-of-stock' && item.stock === 0);
                        
                        return matchesSearch && matchesCategory && matchesStock;
                    });
                },

                formatCurrency(amount) {
                    return new Intl.NumberFormat('en-NG', {
                        style: 'currency',
                        currency: 'NGN',
                        minimumFractionDigits: 0
                    }).format(amount || 0);
                },

                formatDate(dateString) {
                    return new Date(dateString).toLocaleDateString('en-GB');
                },

                getStockStatusClass(stock, minStock) {
                    if (stock === 0) return 'bg-red-100 text-red-800';
                    if (stock <= minStock) return 'bg-yellow-100 text-yellow-800';
                    return 'bg-green-100 text-green-800';
                },

                getStockStatus(stock, minStock) {
                    if (stock === 0) return 'Out';
                    if (stock <= minStock) return 'Low';
                    return 'Good';
                },

                getStockIcon(stock, minStock) {
                    if (stock === 0) return 'fas fa-times-circle';
                    if (stock <= minStock) return 'fas fa-exclamation-triangle';
                    return 'fas fa-check-circle';
                },

                clearFilters() {
                    this.searchTerm = '';
                    this.selectedCategory = '';
                    this.stockFilter = '';
                },

                adjustStock(item) {
                    this.adjustmentForm.productId = item.id;
                    this.showAdjustModal = true;
                },

                processStockAdjustment() {
                    const item = this.inventoryItems.find(i => i.id == this.adjustmentForm.productId);
                    if (item) {
                        let newStock = item.stock;
                        if (this.adjustmentForm.type === 'increase') {
                            newStock += parseInt(this.adjustmentForm.quantity);
                        } else if (this.adjustmentForm.type === 'decrease') {
                            newStock -= parseInt(this.adjustmentForm.quantity);
                        } else {
                            newStock = parseInt(this.adjustmentForm.quantity);
                        }
                        
                        item.stock = Math.max(0, newStock);
                        item.lastUpdated = new Date().toISOString().split('T')[0];
                        
                        window.notifications?.show('Stock adjustment completed successfully!', 'success');
                        this.showAdjustModal = false;
                        this.adjustmentForm = { productId: '', type: 'increase', quantity: 1, reason: '' };
                    }
                },

                processStockReceiving() {
                    const item = this.inventoryItems.find(i => i.id == this.receiveForm.productId);
                    if (item) {
                        item.stock += parseInt(this.receiveForm.quantity);
                        item.lastUpdated = new Date().toISOString().split('T')[0];
                        
                        window.notifications?.show(`Received ${this.receiveForm.quantity} units of ${item.name}`, 'success');
                        this.showReceiveModal = false;
                        this.receiveForm = { productId: '', quantity: 1, supplier: '', poNumber: '' };
                    }
                },

                viewHistory(item) {
                    window.notifications?.show('Stock history feature coming soon!', 'info');
                }
            }
        }
    </script>
</body>
</html>
