<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Inventory Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="js/app.js"></script>
</head>
<body class="bg-gray-50">
    <div x-data="{ sidebarOpen: false, currentPage: 'products', ...productManager() }">
        <!-- Sidebar -->
        <div id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-white shadow-lg transform transition-transform duration-300 ease-in-out -translate-x-full lg:translate-x-0">
            <div class="flex items-center justify-center h-16 bg-blue-600">
                <h1 class="text-white text-xl font-bold">Inventory System</h1>
            </div>
            <nav class="mt-5">
                <a href="index.html" data-nav-item="dashboard"
                   class="flex items-center px-6 py-2 text-gray-700 hover:bg-gray-100">
                    <i class="fas fa-tachometer-alt mr-3"></i>
                    Dashboard
                </a>
                <a href="products.html" data-nav-item="products"
                   class="flex items-center px-6 py-2 text-gray-700 hover:bg-gray-100 bg-gray-100">
                    <i class="fas fa-box mr-3"></i>
                    Products
                </a>
                <a href="inventory.html" data-nav-item="inventory"
                   class="flex items-center px-6 py-2 text-gray-700 hover:bg-gray-100">
                    <i class="fas fa-warehouse mr-3"></i>
                    Inventory
                </a>
                <a href="customers.html" data-nav-item="customers"
                   class="flex items-center px-6 py-2 text-gray-700 hover:bg-gray-100">
                    <i class="fas fa-users mr-3"></i>
                    Customers
                </a>
                <a href="invoices.html" data-nav-item="invoices"
                   class="flex items-center px-6 py-2 text-gray-700 hover:bg-gray-100">
                    <i class="fas fa-file-invoice mr-3"></i>
                    Invoices
                </a>
                <a href="pos.html" data-nav-item="pos"
                   class="flex items-center px-6 py-2 text-gray-700 hover:bg-gray-100">
                    <i class="fas fa-cash-register mr-3"></i>
                    POS
                </a>
                <a href="reports.html" data-nav-item="reports"
                   class="flex items-center px-6 py-2 text-gray-700 hover:bg-gray-100">
                    <i class="fas fa-chart-bar mr-3"></i>
                    Reports
                </a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="lg:ml-64">
            <!-- Header -->
            <header class="bg-white shadow-sm border-b border-gray-200">
                <div class="flex items-center justify-between px-6 py-4">
                    <div class="flex items-center">
                        <button id="sidebar-toggle" class="lg:hidden text-gray-500 hover:text-gray-700">
                            <i class="fas fa-bars text-xl"></i>
                        </button>
                        <h2 class="ml-4 text-xl font-semibold text-gray-800">Product Catalog</h2>
                    </div>
                    <button @click="showAddModal = true" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                        <i class="fas fa-plus mr-2"></i>Add Product
                    </button>
                </div>
            </header>

            <!-- Page Content -->
            <main class="p-6">
            <!-- Filters and Search -->
            <div class="bg-white rounded-lg shadow mb-6 p-6">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Search Products</label>
                        <div class="relative">
                            <input type="text" x-model="searchTerm" placeholder="Search by name or SKU..." 
                                   class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Category</label>
                        <select x-model="selectedCategory" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="">All Categories</option>
                            <option value="Car Batteries">Car Batteries</option>
                            <option value="Motorcycle Batteries">Motorcycle Batteries</option>
                            <option value="Inverter Batteries">Inverter Batteries</option>
                            <option value="Solar Batteries">Solar Batteries</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Stock Status</label>
                        <select x-model="stockFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="">All Stock</option>
                            <option value="in-stock">In Stock</option>
                            <option value="low-stock">Low Stock</option>
                            <option value="out-of-stock">Out of Stock</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <button @click="clearFilters()" class="w-full px-4 py-2 text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                            <i class="fas fa-times mr-2"></i>Clear Filters
                        </button>
                    </div>
                </div>
            </div>

            <!-- Products Table -->
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-200">
                    <div class="flex items-center justify-between">
                        <h3 class="text-lg font-semibold text-gray-800">Products</h3>
                        <span class="text-sm text-gray-500" x-text="`${filteredProducts.length} products`"></span>
                    </div>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Product</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">SKU</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Category</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Stock</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Cost Price</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Selling Price</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            <template x-for="product in filteredProducts" :key="product.id">
                                <tr class="hover:bg-gray-50">
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <div class="flex items-center">
                                            <div class="h-12 w-12 bg-gray-200 rounded-lg mr-4 flex items-center justify-center">
                                                <i class="fas fa-car-battery text-gray-500"></i>
                                            </div>
                                            <div>
                                                <div class="text-sm font-medium text-gray-900" x-text="product.name"></div>
                                                <div class="text-sm text-gray-500" x-text="product.description"></div>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" x-text="product.sku"></td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" x-text="product.category"></td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <span :class="getStockStatusClass(product.stock, product.minStock)" 
                                              class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                                              x-text="getStockStatusText(product.stock, product.minStock)">
                                        </span>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" x-text="formatCurrency(product.costPrice)"></td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" x-text="formatCurrency(product.sellingPrice)"></td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                        <button @click="editProduct(product)" class="text-indigo-600 hover:text-indigo-900 mr-3">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                        <button @click="deleteProduct(product.id)" class="text-red-600 hover:text-red-900">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
            </main>
        </div>

        <!-- Mobile sidebar overlay -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-gray-600 bg-opacity-75 lg:hidden hidden"></div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div x-show="showAddModal || showEditModal" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50"
         style="display: none;">
        
        <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-3/4 lg:w-1/2 shadow-lg rounded-md bg-white">
            <div class="mt-3">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-medium text-gray-900" x-text="showEditModal ? 'Edit Product' : 'Add New Product'"></h3>
                    <button @click="closeModal()" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                
                <form @submit.prevent="saveProduct()" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Product Name *</label>
                            <input type="text" x-model="currentProduct.name" required
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">SKU *</label>
                            <input type="text" x-model="currentProduct.sku" required
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                        <textarea x-model="currentProduct.description" rows="3"
                                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Category *</label>
                            <select x-model="currentProduct.category" required
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="">Select Category</option>
                                <option value="Car Batteries">Car Batteries</option>
                                <option value="Motorcycle Batteries">Motorcycle Batteries</option>
                                <option value="Inverter Batteries">Inverter Batteries</option>
                                <option value="Solar Batteries">Solar Batteries</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Brand</label>
                            <input type="text" x-model="currentProduct.brand"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Cost Price (₦) *</label>
                            <input type="number" x-model="currentProduct.costPrice" required min="0" step="0.01"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Selling Price (₦) *</label>
                            <input type="number" x-model="currentProduct.sellingPrice" required min="0" step="0.01"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Tax Rate (%)</label>
                            <input type="number" x-model="currentProduct.taxRate" min="0" max="100" step="0.01"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Current Stock</label>
                            <input type="number" x-model="currentProduct.stock" min="0"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Minimum Stock Level</label>
                            <input type="number" x-model="currentProduct.minStock" min="0"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                    </div>

                    <div class="flex justify-end space-x-4 pt-6 border-t border-gray-200">
                        <button type="button" @click="closeModal()" 
                                class="px-4 py-2 text-gray-700 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                            Cancel
                        </button>
                        <button type="submit" 
                                class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                            <span x-text="showEditModal ? 'Update Product' : 'Add Product'"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function productManager() {
            return {
                showAddModal: false,
                showEditModal: false,
                searchTerm: '',
                selectedCategory: '',
                stockFilter: '',
                currentProduct: {
                    name: '',
                    sku: '',
                    description: '',
                    category: '',
                    brand: '',
                    costPrice: 0,
                    sellingPrice: 0,
                    taxRate: 7.5,
                    stock: 0,
                    minStock: 5
                },
                products: [
                    {
                        id: 1,
                        name: 'VISCA 100AH BATTERY',
                        sku: 'VISCA-100AH',
                        description: '12V Lead Acid Battery',
                        category: 'Car Batteries',
                        brand: 'VISCA',
                        costPrice: 65000,
                        sellingPrice: 80000,
                        taxRate: 7.5,
                        stock: 25,
                        minStock: 5
                    },
                    {
                        id: 2,
                        name: 'SOLITE 75AH BATTERY',
                        sku: 'SOLITE-75AH',
                        description: '12V Maintenance Free Battery',
                        category: 'Car Batteries',
                        brand: 'SOLITE',
                        costPrice: 45000,
                        sellingPrice: 60000,
                        taxRate: 7.5,
                        stock: 3,
                        minStock: 5
                    },
                    {
                        id: 3,
                        name: 'RUN-ALL 90AH BATTERY',
                        sku: 'RUNALL-90AH',
                        description: '12V Deep Cycle Battery',
                        category: 'Car Batteries',
                        brand: 'RUN-ALL',
                        costPrice: 55000,
                        sellingPrice: 70000,
                        taxRate: 7.5,
                        stock: 15,
                        minStock: 5
                    }
                ],

                get filteredProducts() {
                    return this.products.filter(product => {
                        const matchesSearch = !this.searchTerm || 
                            product.name.toLowerCase().includes(this.searchTerm.toLowerCase()) ||
                            product.sku.toLowerCase().includes(this.searchTerm.toLowerCase());
                        
                        const matchesCategory = !this.selectedCategory || 
                            product.category === this.selectedCategory;
                        
                        const matchesStock = !this.stockFilter || 
                            (this.stockFilter === 'in-stock' && product.stock > product.minStock) ||
                            (this.stockFilter === 'low-stock' && product.stock <= product.minStock && product.stock > 0) ||
                            (this.stockFilter === 'out-of-stock' && product.stock === 0);
                        
                        return matchesSearch && matchesCategory && matchesStock;
                    });
                },

                formatCurrency(amount) {
                    return new Intl.NumberFormat('en-NG', {
                        style: 'currency',
                        currency: 'NGN',
                        minimumFractionDigits: 0
                    }).format(amount);
                },

                getStockStatusClass(stock, minStock) {
                    if (stock === 0) return 'bg-red-100 text-red-800';
                    if (stock <= minStock) return 'bg-yellow-100 text-yellow-800';
                    return 'bg-green-100 text-green-800';
                },

                getStockStatusText(stock, minStock) {
                    if (stock === 0) return 'Out of Stock';
                    if (stock <= minStock) return `Low Stock (${stock})`;
                    return `${stock} in stock`;
                },

                clearFilters() {
                    this.searchTerm = '';
                    this.selectedCategory = '';
                    this.stockFilter = '';
                },

                resetForm() {
                    this.currentProduct = {
                        name: '',
                        sku: '',
                        description: '',
                        category: '',
                        brand: '',
                        costPrice: 0,
                        sellingPrice: 0,
                        taxRate: 7.5,
                        stock: 0,
                        minStock: 5
                    };
                },

                closeModal() {
                    this.showAddModal = false;
                    this.showEditModal = false;
                    this.resetForm();
                },

                editProduct(product) {
                    this.currentProduct = { ...product };
                    this.showEditModal = true;
                },

                saveProduct() {
                    if (this.showEditModal) {
                        // Update existing product
                        const index = this.products.findIndex(p => p.id === this.currentProduct.id);
                        this.products[index] = { ...this.currentProduct };
                    } else {
                        // Add new product
                        this.currentProduct.id = Math.max(...this.products.map(p => p.id)) + 1;
                        this.products.push({ ...this.currentProduct });
                    }
                    this.closeModal();
                },

                deleteProduct(id) {
                    if (confirm('Are you sure you want to delete this product?')) {
                        this.products = this.products.filter(p => p.id !== id);
                    }
                }
            }
        }
    </script>
</body>
</html>
